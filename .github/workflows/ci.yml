name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Docs drift check
        run: |
          set -o pipefail
          npm run docs:check 2>&1 | tee ci-logs/docs-check.log

      - name: Upload docs logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-ci-logs
          path: ci-logs/docs-*.log
          if-no-files-found: ignore

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Backend import smoke test
        working-directory: backend
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../ci-logs/backend-import.log
          import app.main
          print("backend-import-ok")
          PY

      - name: Backend flake8
        run: |
          set -o pipefail
          python -m flake8 --config backend/.flake8 backend/app backend/tests 2>&1 | tee ci-logs/backend-flake8.log

      - name: Backend mypy
        run: |
          set -o pipefail
          python -m mypy --config-file backend/pyproject.toml backend/app/config.py backend/app/core/password_policy.py backend/app/core/exceptions.py 2>&1 | tee ci-logs/backend-mypy.log

      - name: Backend isort check
        run: |
          set -o pipefail
          python -m isort --check-only backend/app backend/tests 2>&1 | tee ci-logs/backend-isort.log

      - name: Backend black check
        run: |
          set -o pipefail
          python -m black --check backend/app backend/tests 2>&1 | tee ci-logs/backend-black.log

      - name: Backend tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee ../ci-logs/backend-pytest.log

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-logs
          path: ci-logs/backend-*.log
          if-no-files-found: ignore

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Frontend lint
        working-directory: frontend
        env:
          CI: "true"
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../ci-logs/frontend-lint.log

      - name: Frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee ../ci-logs/frontend-test.log

      - name: Frontend build
        working-directory: frontend
        env:
          CI: "true"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../ci-logs/frontend-build.log

      - name: Upload frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-logs
          path: ci-logs/frontend-*.log
          if-no-files-found: ignore

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - docs
      - backend
      - frontend

    steps:
      - name: Publish workflow summary
        run: |
          {
            echo "## CI Results"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Docs Drift Check | ${{ needs.docs.result }} |"
            echo "| Backend Checks | ${{ needs.backend.result }} |"
            echo "| Frontend Checks | ${{ needs.frontend.result }} |"
            echo
            echo "Docs checks README/TODO/runtime roadmap alignment."
            echo "Backend runs import, flake8, mypy, isort, black, and pytest."
            echo "Frontend runs eslint, vitest, and the production build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when required jobs fail
        run: |
          if [[ "${{ needs.docs.result }}" != "success" || "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            exit 1
          fi
